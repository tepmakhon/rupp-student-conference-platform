services:
  postgres:
    image: postgres:17

    container_name: rupp-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: rupp_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rupp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: rupp-backend

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5050:5050"

    env_file:
      - ./backend/.env

volumes:
  postgres_data:
